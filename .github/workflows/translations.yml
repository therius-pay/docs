name: Translations up to date

on:
  pull_request:
    paths:
      - '**/*.mdx'
      - 'docs.json'
  push:
    branches: [main]
    paths:
      - '**/*.mdx'
      - 'docs.json'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check es/ and pt/ translations against their English sources
        # STRICT=1: every English page must have an es/ and pt/ counterpart.
        # Safe to enforce now that the full corpus is translated (all 63 nav pages).
        run: STRICT=1 node .translation/check-staleness.mjs
